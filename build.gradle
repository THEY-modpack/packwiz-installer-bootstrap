plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.6.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

dependencies {
    implementation 'com.eclipsesource.minimal-json:minimal-json:0.9.5'
    implementation 'commons-cli:commons-cli:1.4'
    //testImplementation 'junit:junit:4.12'
}

repositories {
    mavenCentral()
}

def testProjectDirectory = layout.buildDirectory.dir('test-project')

application {
    mainClass = 'link.infra.packwiz.installer.bootstrap.Main'
}

tasks.named('run', JavaExec) {
    workingDir = testProjectDirectory.get().asFile

    doFirst {
        testProjectDirectory.get().asFile.mkdirs()
    }
}

jar {
    manifest {
        attributes('Main-Class': 'link.infra.packwiz.installer.bootstrap.Main')
    }
}